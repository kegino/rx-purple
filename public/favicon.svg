<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de fundo escuro com tom roxo profundo -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a2b"/>
      <stop offset="50%" stop-color="#0a0517"/>
      <stop offset="100%" stop-color="#05020c"/>
    </linearGradient>

    <!-- Gradiente Roxo Neon Principal -->
    <linearGradient id="purple-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="30%" stop-color="#c084fc"/>
      <stop offset="70%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>

    <!-- Gradiente Magenta / Rosa Eletrico -->
    <linearGradient id="pink-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container principal -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="url(#border-grad)" stroke-width="4"/>

  <!-- Simbolo RX Purple Futurista -->
  <g id="rx-logo" filter="url(#neon-glow)" transform="translate(4, 0)">
    <!-- Letra R estilizada -->
    <path d="M110 130 H210 C255 130 280 155 280 195 C280 230 258 252 225 258 L285 380 H232 L178 268 H160 V380 H110 Z M160 224 H205 C225 224 235 214 235 195 C235 176 225 166 205 166 H160 Z" fill="url(#purple-neon)"/>

    <!-- Letra X estilizada entrelaçada com triangulo de Play -->
    <!-- Haste esquerda do X -->
    <path d="M295 130 L360 240 L310 380 H358 L390 285 L425 380 H475 L415 240 L465 130 H418 L390 200 L345 130 Z" fill="url(#pink-accent)"/>

    <!-- Triângulo de Play central fluorescente no X -->
    <path d="M375 220 L415 245 L375 270 Z" fill="#ffffff" opacity="0.95"/>

    <!-- Ondas de transmissao no topo direito -->
    <path d="M440 160 A32 32 0 0 1 440 210" stroke="#f0abfc" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M460 145 A54 54 0 0 1 460 225" stroke="#ec4899" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>
</svg>